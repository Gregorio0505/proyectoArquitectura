# 1) CPU de host alta
alarm: host_cpu_high
on: system.cpu
lookup: average -5m unaligned of user,system,softirq,irq
units: %
every: 30s
warn: $this > 0.3
crit: $this > 0.5
to: sysadmin
info: "CPU del host alta."

# 2) Load average alto (normalizado por cores)
alarm: host_load_high
on: system.load
lookup: average -5m unaligned of load15
every: 1m
warn: $this > ( $cores * 0.8 )
crit: $this > ( $cores * 1.0 )
to: sysadmin
info: "Load average del host alto para la cantidad de CPUs."

# 3) Disco raíz casi lleno
alarm: root_disk_used
on: disk_space._root   # suele mapear a /
lookup: average -5m unaligned of used
every: 1m
warn: $this > ( $total * 0.80 )
crit: $this > ( $total * 0.90 )
to: sysadmin
info: "Uso de disco en / alto."

# 4) Conexiones TCP en TIME_WAIT (posible saturación)
alarm: tcp_timewait_high
on: system.net
lookup: average -5m unaligned of tcp_time_wait
every: 1m
warn: $this > 2000
crit: $this > 5000
to: sysadmin
info: "Muchas conexiones TCP en TIME_WAIT."
